name: Deploy backup platform

on:
  workflow_dispatch:
    inputs:
      image:
        description: Immutable ACR image reference; leave empty only for the disabled bootstrap deployment
        required: false
        default: ''
        type: string
      enable_schedule:
        description: Enable the daily backup schedule after smoke validation
        required: true
        default: false
        type: boolean
      enable_restore_validation:
        description: Enable monthly restore access and schedule after isolated-target validation
        required: true
        default: false
        type: boolean
      apply:
        description: Apply after what-if and environment approval
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  SUBSCRIPTION_ID: ${{ vars.AZURE_BACKUP_SUBSCRIPTION_ID }}
  TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  SOURCE_ACCOUNT_ID: ${{ vars.SOURCE_COSMOS_ACCOUNT_RESOURCE_ID }}
  LOCATION: polandcentral

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: backup-nonprod
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_BACKUP_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ env.TENANT_ID }}
          subscription-id: ${{ env.SUBSCRIPTION_ID }}
      - name: Validate Bicep
        run: |
          az bicep restore --file infra/main.bicep
          az bicep lint --file infra/main.bicep
          az bicep build --file infra/main.bicep --stdout >/dev/null
      - name: What-if
        env:
          ALLOW_ROLE_ASSIGNMENT_CHANGES: '1'
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_ENABLE_SCHEDULE: ${{ inputs.enable_schedule }}
          INPUT_ENABLE_RESTORE: ${{ inputs.enable_restore_validation }}
        run: |
          image="$INPUT_IMAGE"
          if [[ -n "$image" ]]; then
            case "$image" in *@sha256:*) ;; *) echo 'Image must use a sha256 digest' >&2; exit 1;; esac
          elif [[ "$INPUT_ENABLE_SCHEDULE" == "true" || "$INPUT_ENABLE_RESTORE" == "true" ]]; then
            echo 'A digest-pinned image is required before enabling a schedule' >&2
            exit 1
          fi
          name="backup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image_args=()
          [[ -z "$image" ]] || image_args=(backupImage="$image")
          az deployment sub what-if --name "$name" --location "$LOCATION" \
            --template-file infra/main.bicep \
            --parameters infra/parameters/nonprod.bicepparam \
            --parameters "${image_args[@]}" sourceCosmosAccountResourceId="$SOURCE_ACCOUNT_ID" \
              scheduleEnabled="$INPUT_ENABLE_SCHEDULE" \
              restoreScheduleEnabled="$INPUT_ENABLE_RESTORE" \
              restoreAccessEnabled="$INPUT_ENABLE_RESTORE" \
            --result-format FullResourcePayloads --output json > what-if.json
          python3 scripts/guard-what-if.py what-if.json
      - name: Upload what-if
        uses: actions/upload-artifact@v4
        with:
          name: backup-what-if-${{ github.run_id }}
          path: what-if.json
      - name: Deploy
        if: inputs.apply
        env:
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_ENABLE_SCHEDULE: ${{ inputs.enable_schedule }}
          INPUT_ENABLE_RESTORE: ${{ inputs.enable_restore_validation }}
        run: |
          name="backup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image_args=()
          [[ -z "$INPUT_IMAGE" ]] || image_args=(backupImage="$INPUT_IMAGE")
          az deployment sub create --name "$name" --location "$LOCATION" \
            --template-file infra/main.bicep \
            --parameters infra/parameters/nonprod.bicepparam \
            --parameters "${image_args[@]}" sourceCosmosAccountResourceId="$SOURCE_ACCOUNT_ID" \
              scheduleEnabled="$INPUT_ENABLE_SCHEDULE" \
              restoreScheduleEnabled="$INPUT_ENABLE_RESTORE" \
              restoreAccessEnabled="$INPUT_ENABLE_RESTORE" \
            --output json > deployment.json
      - name: Upload deployment outputs
        if: inputs.apply
        uses: actions/upload-artifact@v4
        with:
          name: backup-deployment-${{ github.run_id }}
          path: deployment.json
